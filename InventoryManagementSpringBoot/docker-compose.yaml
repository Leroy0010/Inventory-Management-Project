# Development Docker Compose
# Complete development environment with all services

services:
    # PostgreSQL Database
    postgres:
        image: postgres:16-alpine
        container_name: inventorymanagementdb
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-InventoryManagementDB}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
        ports:
          # Bind to localhost
          - "127.0.0.1:5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - inventory-network
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U postgres -d InventoryManagementDB"]
            interval: 10s
            timeout: 5s
            retries: 5

    # Spring Boot Application
    app:
        build:
            context: .
            dockerfile: Dockerfile.dev
        container_name: inventory-app-dev
        develop:
            watch:
                - action: rebuild
                  path: ./src
                  target: /app/src

        env_file:
            - .env
        environment:
            # Database Configuration
            SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/InventoryManagementDB}
            SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
            SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
            SPRING_JPA_HIBERNATE_DDL_AUTO: none # Or 'create', 'create-drop' etc.

            # Session Configuration (JDBC for dev)
            SPRING_SESSION_STORE_TYPE: jdbc
            SPRING_SESSION_JDBC_INITIALIZE_SCHEMA: always
            SPRING_SESSION_JDBC_TABLE_NAME: spring_session
            SPRING_SESSION_TIMEOUT: 1800

            # Application Configuration
            SPRING_PROFILES_ACTIVE: dev
            SERVER_PORT: 8080

            # OAuth2 Configuration (Development)
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your_dev_client_id}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your_dev_client_secret}
            GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/google}

            # JWT Configuration
            JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_key_very_long_and_secure}
            JWT_EXPIRATION: ${JWT_EXPIRATION:-1800000}
            # JWT Cookie flags for local HTTP
            JWT_COOKIE_NAME: ${JWT_COOKIE_NAME:-jwt}
            JWT_REFRESH_COOKIE_NAME: ${JWT_REFRESH_COOKIE_NAME:-refreshToken}
            JWT_COOKIE_DOMAIN: ${JWT_COOKIE_DOMAIN:-}
            JWT_COOKIE_PATH: ${JWT_COOKIE_PATH:-/}
            JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
            JWT_COOKIE_HTTP_ONLY: ${JWT_COOKIE_HTTP_ONLY:-true}
            JWT_COOKIE_SAME_SITE: ${JWT_COOKIE_SAME_SITE:-Lax}

            # Frontend Configuration
            FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}

            # Cookie Configuration
            COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
            COOKIE_SECURE: ${COOKIE_SECURE:-false}
            COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-LAX}

            # Mail Configuration (Optional for dev)
            MAIL_USERNAME: ${MAIL_USERNAME:-}
            MAIL_PASSWORD: ${MAIL_PASSWORD:-}

            # VAPID Keys (Optional for dev)
            VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
            VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}

            # AWS S3 Configuration
            AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
            AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
            AWS_S3_REGION: ${AWS_S3_REGION}
            AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}

        ports:
          - "8080:8080"
            # Bind debug port to localhost only
          - "127.0.0.1:5005:5005"
        volumes:
            - ./src:/app/src # Hot reload
            - ./logs:/app/logs
            - ~/.m2:/root/.m2
        depends_on:
            postgres:
                condition: service_healthy

        networks:
            - inventory-network
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -f http://localhost:8080/actuator/health || exit 1",
                ]
            interval: 20s
            timeout: 10s
            retries: 5

    # pgAdmin for Database Management (Optional)
    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: inventory-pgadmin-dev
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@inventory.com
            PGADMIN_DEFAULT_PASSWORD: admin123
            PGADMIN_CONFIG_SERVER_MODE: "False"
        ports:
            - "5050:80"
        volumes:
            - pgadmin_data:/var/lib/pgadmin
        depends_on:
            - postgres
        networks:
            - inventory-network
        profiles:
            - tools

volumes:
    postgres_data:
        driver: local
    pgadmin_data:
        driver: local


networks:
    inventory-network:
        driver: bridge
