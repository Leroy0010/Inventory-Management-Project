# Production Docker Compose Configuration
# Load environment variables from docker-compose.env file
# Run: cp docker-compose.env .env and update with your production values

services:
    backend:
        build:
            context: .
            dockerfile: Dockerfile.prod
        restart: unless-stopped
        volumes:
            - C:/run/secrets/credentials.json:/run/secrets/credentials.json:ro
            - app_logs:/app/logs
        ports:
            - "8080:8080"
        env_file:
            - .env
        environment:
            # Spring Boot database connection properties
            SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://database:5432/InventoryManagementDB}
            SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
            SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
            SPRING_PROFILES_ACTIVE: prod
            SPRING_JPA_HIBERNATE_DDL_AUTO: validate
            JWT_SECRET: ${JWT_SECRET}
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
            GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
            MAIL_USERNAME: ${MAIL_USERNAME}
            MAIL_PASSWORD: ${MAIL_PASSWORD}
            MAIL_PORT: ${MAIL_PORT:-465}
            MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
            FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
            GOOGLE_DRIVE_CREDENTIALS_CLASS_PATH: ${GOOGLE_DRIVE_CREDENTIALS_CLASS_PATH}
            GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID}
            AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
            AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
            AWS_S3_REGION: ${AWS_S3_REGION}
            AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
            VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
            VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
            # Production-specific settings
            COOKIE_SECURE: true
            JWT_COOKIE_SECURE: true
            JWT_COOKIE_SAME_SITE: Strict
            SERVER_CONTEXT_PATH: ${SERVER_CONTEXT_PATH:-}
        depends_on:
            database:
                condition: service_healthy
        networks:
            - app-network
        deploy:
            resources:
                limits:
                    memory: 2G
                    cpus: "1.0"
                reservations:
                    memory: 512M
                    cpus: "0.5"

    database:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-InventoryManagementDB}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - db_data:/var/lib/postgresql/data
            - ./custom-pg-hba.conf:/etc/postgresql/pg_hba.conf:ro
        networks:
            - app-network
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-InventoryManagementDB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        deploy:
            resources:
                limits:
                    memory: 1G
                    cpus: "0.5"
                reservations:
                    memory: 256M
                    cpus: "0.25"

    # Optional: Redis for caching (uncomment if needed)
    # redis:
    #     image: redis:7-alpine
    #     restart: unless-stopped
    #     ports:
    #         - "6379:6379"
    #     volumes:
    #         - redis_data:/data
    #     networks:
    #         - app-network
    #     command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

    # Optional: Nginx reverse proxy (uncomment if needed)
    # nginx:
    #     image: nginx:alpine
    #     restart: unless-stopped
    #     ports:
    #         - "80:80"
    #         - "443:443"
    #     volumes:
    #         - ./nginx.conf:/etc/nginx/nginx.conf:ro
    #         - ./ssl:/etc/nginx/ssl:ro
    #     depends_on:
    #         - backend
    #     networks:
    #         - app-network

volumes:
    db_data:
    app_logs:
    # redis_data: # Uncomment if using Redis

networks:
    app-network:
        driver: bridge
