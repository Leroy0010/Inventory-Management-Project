    public:
        key: ${VAPID_PUBLIC_KEY:BEqA-s8JXB450K8KblHvwC0l2oOLviV7_zh8ntpmTzKoGv7vAASqTpbgoENGqLCL2wUrvSLopkLfOEabvH1XU_8}

# Actuator Configuration for Production Monitoring
management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics,prometheus

    endpoint:
        health:
            show-details: when-authorized
            show-components: always
    health:
        db:
            enabled: true
        diskspace:
            enabled: true
    prometheus:
        metrics:
            export:
                enabled: true
    metrics:
        distribution:
            percentiles-histogram:
                http.server.requests: true
            percentiles:
                http.server.requests: 0.5, 0.95, 0.99
            slo:
                http.server.requests: 50ms, 100ms, 200ms, 500ms

# Logging Configuration for Production
logging:
    level:
        root: INFO
        com.leroy.inventorymanagementspringboot: INFO
        # Enable detailed auth debugging for our security classes
        com.leroy.inventorymanagementspringboot.security: DEBUG
        com.leroy.inventorymanagementspringboot.controller: DEBUG
        # See Spring Security auth decisions without being too noisy
        org.springframework.security: INFO
        org.springframework.web: WARN
        org.hibernate.SQL: WARN
        org.hibernate.type.descriptor.sql.BasicBinder: WARN
        org.springframework.boot.autoconfigure: WARN
        org.springframework.boot.actuate: INFO
    pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
        file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file:
        name: logs/app.log
        max-size: 10MB
        max-history: 30
        total-size-cap: 1GB
