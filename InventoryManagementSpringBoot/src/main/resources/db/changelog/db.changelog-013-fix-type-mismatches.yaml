                    newDataType: INTEGER

              # Fix audit_log.user_id to match users.id (INTEGER)
              # users.id is SERIAL (INTEGER), audit_log.user_id is already INT
              - modifyDataType:
                    tableName: audit_log
                    columnName: user_id
                    newDataType: INTEGER

              # Fix audit_log.entity_id to match entity IDs (INTEGER)
              # Most entity IDs are INTEGER, audit_log.entity_id is already INT
              - modifyDataType:
                    tableName: audit_log
                    columnName: entity_id
                    newDataType: INTEGER

              # Fix refresh_tokens.user_id to match users.id (INTEGER)
              # users.id is SERIAL (INTEGER), refresh_tokens.user_id is already INT
              - modifyDataType:
                    tableName: refresh_tokens
                    columnName: user_id
                    newDataType: INTEGER

              # Fix user_settings.user_id to match users.id (INTEGER)
              # users.id is SERIAL (INTEGER), user_settings.user_id is already INT
              - modifyDataType:
                    tableName: user_settings
                    columnName: user_id
                    newDataType: INTEGER

              # Fix push_subscriptions.user_id to match users.id (INTEGER)
              # users.id is SERIAL (INTEGER), push_subscriptions.user_id is already INT
              - modifyDataType:
                    tableName: push_subscriptions
                    columnName: user_id
                    newDataType: INTEGER
