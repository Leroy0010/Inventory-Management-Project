# Production Docker Compose
# Production environment with JDBC sessions and optimized settings


services:
    # PostgreSQL Database
    postgres:
        image: postgres:16-alpine
        container_name: inventory-postgres-prod
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"

        volumes:
            - postgres_prod_data:/var/lib/postgresql/data
            - ./custom-pg-hba.conf:/etc/postgresql/pg_hba.conf
        networks:
            - inventory-network
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-prod_user} -d ${POSTGRES_DB:-inventorymanagementdb_prod}",
                ]
            interval: 30s
            timeout: 10s
            retries: 5
        restart: always
        deploy:
            resources:
                limits:
                    memory: 1G
                reservations:
                    memory: 512M

    # Spring Boot Application
    app:
        build:
            context: .
            dockerfile: Dockerfile.prod
        container_name: inventory-app-prod
        environment:
            # Database Configuration
            SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
            SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
            SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
            SPRING_JPA_HIBERNATE_DDL_AUTO: none # Or 'create', 'create-drop' etc.

            # Session Configuration (JDBC for production)
            SPRING_SESSION_STORE_TYPE: jdbc
            SPRING_SESSION_JDBC_INITIALIZE_SCHEMA: always
            SPRING_SESSION_JDBC_TABLE_NAME: spring_session
            SPRING_SESSION_TIMEOUT: ${SPRING_SESSION_TIMEOUT}

            # Application Configuration
            SPRING_PROFILES_ACTIVE: prod
            SERVER_PORT: ${SERVER_PORT}

            # OAuth2 Configuration (Production)
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
            GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}

            # JWT Configuration
            JWT_SECRET: ${JWT_SECRET}
            JWT_EXPIRATION: ${JWT_EXPIRATION}

            # Frontend Configuration
            FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}

            # Cookie Configuration
            COOKIE_DOMAIN: ${COOKIE_DOMAIN}
            COOKIE_SECURE: ${COOKIE_SECURE}
            COOKIE_HTTP_ONLY: ${COOKIE_HTTP_ONLY}
            COOKIE_MAX_AGE: ${COOKIE_MAX_AGE}
            COOKIE_PATH: ${COOKIE_PATH}

            # Mail Configuration
            MAIL_USERNAME: ${MAIL_USERNAME}
            MAIL_PASSWORD: ${MAIL_PASSWORD}
            MAIL_HOST: ${MAIL_HOST}
            MAIL_PORT: ${MAIL_PORT}

            # VAPID Keys
            VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
            VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}

            # AWS S3 Configuration
            AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
            AWS_S3_REGION: ${AWS_S3_REGION}
            AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
            AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}


        ports:
            - "8080:8080"
        volumes:
            - app_logs:/app/logs
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - inventory-network
        restart: always
        deploy:
            resources:
                limits:
                    memory: 1G
                reservations:
                    memory: 512M

    # Nginx Reverse Proxy (Optional)
    nginx:
        image: nginx:alpine
        container_name: inventory-nginx-prod
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf
            - ./ssl:/etc/nginx/ssl
        depends_on:
            - app
        networks:
            - inventory-network
        restart: unless-stopped
        profiles:
            - nginx

volumes:
    postgres_prod_data:
        driver: local
    app_logs:
        driver: local

networks:
    inventory-network:
        driver: bridge
