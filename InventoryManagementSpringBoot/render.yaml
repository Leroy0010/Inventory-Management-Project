services:
    - type: web
      name: inventory-management-backend
      env: java
      plan: free
      buildCommand: mvn clean package -DskipTests
      startCommand: java -jar target/InventoryManagementSpringBoot-0.0.1-SNAPSHOT.jar
      envVars:
          - key: SPRING_PROFILES_ACTIVE
            value: prod
          - key: SPRING_DATASOURCE_URL
            fromDatabase:
                name: inventory-db
                property: connectionString
          - key: JWT_SECRET
            generateValue: true
          - key: FRONTEND_BASE_URL
            value: https://your-frontend-app.onrender.com
          - key: GOOGLE_CLIENT_ID
            value: your_google_client_id_here
          - key: GOOGLE_CLIENT_SECRET
            value: your_google_client_secret_here
          - key: MAIL_USERNAME
            value: your_email@gmail.com
          - key: MAIL_PASSWORD
            value: your_app_password_here
          - key: VAPID_PRIVATE_KEY
            value: your_vapid_private_key_here
          - key: VAPID_PUBLIC_KEY
            value: your_vapid_public_key_here
          - key: AWS_S3_BUCKET_NAME
            value: your_s3_bucket_name_here
          - key: AWS_S3_REGION
            value: us-east-1
          - key: AWS_S3_ACCESS_KEY
            value: your_aws_access_key_here
          - key: AWS_S3_SECRET_KEY
            value: your_aws_secret_key_here
          - key: GOOGLE_DRIVE_FOLDER_ID
            value: your_google_drive_folder_id_here

databases:
    - name: inventory-db
      plan: free
      databaseName: InventoryManagementDB
      user: postgres
