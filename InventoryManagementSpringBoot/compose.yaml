# No 'version' field needed anymore for modern Compose Specification
# Load environment variables from docker-compose.env file
# Run: cp docker-compose.env .env and update with your values

services:
    backend:
        # Use development Dockerfile for local development
        build:
            context: .
            dockerfile: Dockerfile.dev
        develop:
            watch:
                - action: rebuild
                  path: ./src
                  target: /app/src
                - action: sync
                  path: ./target
                  target: /app/target
        volumes:
            - C:/run/secrets/credentials.json:/run/secrets/credentials.json:ro
            - ~/.m2:/root/.m2
            # Mount source code for hot reload (optional)
            - ./src:/app/src
        ports:
            - "8080:8080" # Maps port 8080 on your host to port 8080 in the container
        env_file:
            - .env
        environment:
            # Spring Boot database connection properties (adjust as per your needs)
            # These tell your Spring Boot app how to connect to the 'database' service
            SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://database:5432/InventoryManagementDB}
            SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
            SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
            SPRING_JPA_HIBERNATE_DDL_AUTO: none # Or 'create', 'create-drop' etc.
            JWT_SECRET: ${JWT_SECRET:-mnkvbCcshAe8/hPogq0MtGonFJFqYMbTzMgwarqk3hCCxN1gvhA3Swgd4h6Yxyr0zOX0vfcILTtkg+LodbNv7g==}
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your-google-client-secret}
            MAIL_USERNAME: ${MAIL_USERNAME:-your-email@gmail.com}
            MAIL_PASSWORD: ${MAIL_PASSWORD:-your-app-password}
            MAIL_PORT: ${MAIL_PORT:-465}
            FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
            GOOGLE_DRIVE_CREDENTIALS_CLASS_PATH: ${GOOGLE_DRIVE_CREDENTIALS_CLASS_PATH}
            GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID}
            AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
            AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
            AWS_S3_REGION: ${AWS_S3_REGION}
            AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
            VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
            VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
            SERVER_CONTEXT_PATH: ${SERVER_CONTEXT_PATH:-}

        depends_on:
            - database # Ensures the 'database' service starts before the 'backend' service
        # Optional: volume for live reloading with Spring Boot DevTools (advanced, but useful)
        # volumes:
        #   - .:/app
        #   - /app/target
        #   - /root/.m2

    database:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-InventoryManagementDB}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
        ports:
            - "5432:5432"
        volumes:
            - db_data:/var/lib/postgresql/data

volumes:
    db_data: # Define the volume for persistent database data

